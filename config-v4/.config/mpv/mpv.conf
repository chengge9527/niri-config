vo=gpu-next
# hwdec=vaapi
hwdec=auto
gpu-context=wayland
sub-auto=fuzzy

# 断流时保持画面不退出
# keep-open=yes

# 针对网络流：连接中断时自动尝试重连
stream-lavf-o=reconnect=1,reconnect_streamed=1,reconnect_delay_max=5
user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
ytdl=no
